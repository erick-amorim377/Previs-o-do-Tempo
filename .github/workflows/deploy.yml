name: Deploy React app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weather forecast
    env:
      VITE_KEY: ${{ secrets.VITE_KEY }}
      VITE_URL_SEARCH: https://api.openweathermap.org/data/2.5/weather?q=
      VITE_URL_SEARCH_FIVE: https://api.openweathermap.org/data/2.5/forecast?q=
      VITE_URL_SEARCH_COORDS: https://nominatim.openstreetmap.org/reverse?format=json&lat=
      VITE_IMG_CLOUND: https://openweathermap.org/img/wn/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weather forecast/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenWeather API key
        run: |
          if [ -z "$VITE_KEY" ]; then
            echo "Missing VITE_KEY secret."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: weather forecast/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
